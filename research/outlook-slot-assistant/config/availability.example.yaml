# Доступність власника скриньки.
# getSchedule віддає лише зайнятість наявних подій і вважає вільним увесь інший
# час у вікні. Без цього файлу асистент запропонує суботу о сьомій ранку.

timezone: Europe/Kyiv # IANA, не скорочення

working_hours:
  mon: ["10:00", "18:00"]
  tue: ["10:00", "18:00"]
  wed: ["10:00", "18:00"]
  thu: ["10:00", "18:00"]
  fri: ["10:00", "16:00"]
  sat: []
  sun: []

lunch: ["13:00", "14:00"] # вікно, у яке не пропонуємо зустрічі

buffer_before_min: 15 # запас до зустрічі
buffer_after_min: 15 # запас після зустрічі
min_notice_hours: 12 # не пропонувати зустріч раніше ніж за 12 годин
max_candidates: 3 # скільки варіантів показувати співрозмовнику
durations: [30, 45, 60] # дозволені тривалості, хвилини

# Дні, у які асистент не пропонує нічого, попри вільний календар.
blackout_dates:
  - "2026-12-24"
  - "2026-12-31"
